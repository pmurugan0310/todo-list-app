<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful To-Do List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Modern Gradient Background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main Card Styling */
        .todo-container {
            max-width: 650px;
            margin-top: 60px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        /* Header */
        h2 {
            color: #4a3b73;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Input Form */
        .form-control {
            border-radius: 10px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }
        .btn-add {
            background: #667eea;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-add:hover {
            background: #5a6fd1;
            transform: translateY(-2px);
        }

        /* Task Items */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 6px solid #667eea;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }
        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Completed Task Styling */
        .task-item.completed {
            border-left-color: #2ecc71; /* Green border for completed */
            background: #f8f9fa;
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #a0a0a0;
        }

        /* Task Text */
        .task-text {
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            flex-grow: 1;
            margin-left: 10px;
        }

        /* Action Buttons */
        .btn-delete {
            color: #e74c3c;
            background: transparent;
            border: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-delete:hover {
            color: #c0392b;
            transform: scale(1.1);
        }

        /* Footer Counter */
        .task-counter {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="todo-container w-100">
        <h2 class="text-center mb-4">✨ My Tasks</h2>

        <!-- Add Task Form -->
        <form action="/add" method="post" class="d-flex mb-4">
            <input type="text" name="task" class="form-control me-2" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit" class="btn btn-primary btn-add">Add</button>
        </form>

        <!-- Task List -->
        <div class="task-list">
            {% for todo in todos %}
            <!-- If task is done, add the 'completed' class -->
            <div class="task-item {% if todo.done %}completed{% endif %}">

                <div class="d-flex align-items-center w-100">
                    <!-- Clicking the checkbox toggles the task -->
                    <a href="/toggle/{{ loop.index0 }}" class="text-decoration-none fs-4">
                        {% if todo.done %}✅{% else %}⬜{% endif %}
                    </a>
                    <!-- Clicking the text also toggles the task -->
                    <a href="/toggle/{{ loop.index0 }}" class="text-decoration-none task-text">
                        {{ todo.text }}
                    </a>
                </div>

                <!-- Delete Button -->
                <a href="/delete/{{ loop.index0 }}" class="btn btn-delete">✕</a>
            </div>
            {% else %}
            <div class="text-center text-muted py-5">
                <h4>All caught up! 🎉</h4>
                <p>No tasks yet. Add one above to get started.</p>
            </div>
            {% endfor %}
        </div>

        <!-- Counter -->
        {% if todos %}
        <div class="task-counter">
            You have <strong>{{ remaining }}</strong> task(s) remaining.
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
